    <line x1="298" y1="0" x2="298" y2="842"/>
    <line x1="342" y1="0" x2="342" y2="842"/>
    <line x1="386" y1="0" x2="386" y2="842"/>
    <line x1="430" y1="0" x2="430" y2="842"/>
