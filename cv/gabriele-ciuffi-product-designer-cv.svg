    <rect x="236" y="457" width="32" height="3" rx="2" fill="#85745a" opacity=".35"/>
    <rect x="274" y="457" width="32" height="3" rx="2" fill="#111" opacity=".1"/>
    <rect x="312" y="457" width="22" height="3" rx="2" fill="#111" opacity=".1"/>

