      <text x="307" y="758">UX Design</text>
      <rect class="chip" x="364" y="748" width="56" height="15" rx="7"/>
      <text x="371" y="758">UI Design</text>
      <rect class="chip" x="426" y="748" width="86" height="15" rx="7"/>
      <text x="433" y="758">Information Arch.</text>
      <rect class="chip" x="300" y="770" width="66" height="15" rx="7"/>
      <text x="307" y="780">User Flow</text>
      <rect class="chip" x="372" y="770" width="78" height="15" rx="7"/>
      <text x="379" y="780">Responsive UI</text>
      <rect class="chip" x="456" y="770" width="84" height="15" rx="7"/>
      <text x="463" y="780">HTML / CSS / JS</text>
